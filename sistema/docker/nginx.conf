upstream probosque_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # Estáticos (Bootstrap, HTMX, Leaflet copiados en estaticos/vendor; sin CDN)
    location /static/ {
        alias /srv/estaticos/;
        # Sin nombres con huella (los archivos conservan su nombre entre versiones): el navegador guarda la copia pero
        # pregunta en cada carga si cambió (304 si no), para que una versión nueva del JavaScript se tome al recargar.
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Archivos del expediente: solo se entregan después de que Django revisa el permiso
    # (la vista responde con X-Accel-Redirect hacia esta ubicación interna).
    location /protegido/ {
        internal;
        alias /srv/archivos/;
    }

    location / {
        proxy_pass http://probosque_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
