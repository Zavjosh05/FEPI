' font-weight='600' fill='#1d2320'>Aplicación: Django (Python), un solo sistema modular</text></g><g><rect x='40' y='246' width='210' height='44' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='50' y='263' font-size='12' font-weight='600' fill='#1d2320'>M1</text><text  x='50' y='280' font-size='11' fill='#1d2320'>Recepción y expediente</text></g><g><rect x='262' y='246' width='210' height='44' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='272' y='263' font-size='12' font-weight='600' fill='#1d2320'>M2</text><text  x='272' y='280' font-size='11' fill='#1d2320'>Dictamen y Comité</text></g><g><rect x='40' y='298' width='210' height='44' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='50' y='315' font-size='12' font-weight='600' fill='#1d2320'>M3</text><text  x='50' y='332' font-size='11' fill='#1d2320'>Publicación y contrato</text></g><g><rect x='262' y='298' width='210' height='44' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='272' y='315' font-size='12' font-weight='600' fill='#1d2320'>M4</text><text  x='272' y='332' font-size='11' fill='#1d2320'>Ejecución y verificación</text></g><g><rect x='40' y='350' width='210' height='44' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='50' y='367' font-size='12' font-weight='600' fill='#1d2320'>M5</text><text  x='50' y='384' font-size='11' fill='#1d2320'>Pagos</text></g><g><rect x='262' y='350' width='210' height='44' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='272' y='367' font-size='12' font-weight='600' fill='#1d2320'>M6</text><text  x='272' y='384' font-size='11' fill='#1d2320'>Seguimiento y cierre</text></g><g><rect x='40' y='406' width='432' height='52' rx='8' fill='none' stroke='#7d8a83' stroke-width='1.25'/><text  x='52' y='426' font-size='12' font-weight='600' fill='#1d2320'>Núcleo común</text><text  x='52' y='444' font-size='10.5' fill='#5b6660'>expediente único · estados del trámite · roles · plazos (cron) · bitácora</text></g><g><line x1='256' y1='470' x2='256' y2='490' stroke='#7d8a83' stroke-width='1.25' marker-end='url(#arq-arrow)'/></g><g><rect x='24' y='490' width='464' height='92' rx='8' fill='#eef3f0' stroke='#7d8a83' stroke-width='1.25'/><text  x='36' y='512' font-size='12.5' font-weight='600' fill='#1d2320'>Datos</text></g><g><rect x='40' y='522' width='210' height='52' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='50' y='539' font-size='11.5' font-weight='600' fill='#1d2320'>PostgreSQL + PostGIS</text><text  x='50' y='554' font-size='10.5' fill='#5b6660'>expedientes, polígonos,</text><text  x='50' y='568' font-size='10.5' fill='#5b6660'>pagos y bitácora</text></g><g><rect x='262' y='522' width='210' height='52' rx='8' fill='none' stroke='#1F4E3D' stroke-width='1.25'/><text  x='272' y='539' font-size='11.5' font-weight='600' fill='#1d2320'>Archivos en disco</text><text  x='272' y='554' font-size='10.5' fill='#5b6660'>documentos digitalizados,</text><text  x='272' y='568' font-size='10.5' fill='#5b6660'>acuses y contratos en PDF</text></g><g><rect x='512' y='52' width='224' height='530' rx='8' fill='none' stroke='#9a6b1f' stroke-width='2' stroke-dasharray='7 4'/><text  x='524' y='74' font-size='12.5' font-weight='600' fill='#1d2320'>Calculadora forestal (M7)</text><text  x='524' y='91' font-size='10.5' fill='#5b6660'>sin servidor ni base de datos</text></g><g><rect x='524' y='104' width='200' height='77' rx='8' fill='none' stroke='#7d8a83' stroke-width='1.25'/><text  x='534' y='123' font-size='12' font-weight='600' fill='#1d2320'>Fuentes externas</text><text  x='534' y='140' font-size='10.5' fill='#5b6660'>Sentinel-2 (Earth Search STAC)</text><text  x='534' y='155' font-size='10.5' fill='#5b6660'>CONAFOR: incendios, inventario</text><text  x='534' y='170' font-size='10.5' fill='#5b6660'>INEGI: uso del suelo (Serie VII)</text></g><g><line x1='624' y1='181' x2='624' y2='199' stroke='#7d8a83' stroke-width='1.25' marker-end='url(#arq-arrow)'/></g><g><rect x='524' y='199' width='200' height='77' rx='8' fill='none' stroke='#7d8a83' stroke-width='1.25'/><text  x='534' y='218' font-size='12' font-weight='600' fill='#1d2320'>Procesamiento anual</text><text  x='534' y='235' font-size='10.5' fill='#5b6660'>Python: pystac-client,</text><text  x='534' y='250' font-size='10.5' fill='#5b6660'>rasterio, geopandas, numpy</text><text  x='534' y='265' font-size='10.5' fill='#5b6660'>revisión en QGIS</text></g><g><line x1='624' y1='276' x2='624' y2='294' stroke='#7d8a83' stroke-width='1.25' marker-end='url(#arq-arrow)'/></g><g><rect x='524' y='294' width='200' height='62' rx='8' fill='none' stroke='#7d8a83' stroke-width='1.25'/><text  x='534' y='313' font-size='12' font-weight='600' fill='#1d2320'>Resultados en archivos</text><text  x='534' y='330' font-size='10.5' fill='#5b6660'>JSON, TopoJSON y COG</text><text  x='534' y='345' font-size='10.5' fill='#5b6660'>por año y municipio</text></g><g><line x1='624' y1='356' x2='624' y2='374' stroke='#7d8a83' stroke-width='1.25' marker-end='url(#arq-arrow)'/></g><g><rect x='524' y='374' width='200' height='62' rx='8' fill='none' stroke='#7d8a83' stroke-width='1.25'/><text  x='534' y='393' font-size='12' font-weight='600' fill='#1d2320'>Página estática (D3.js)</text><text  x='534' y='410' font-size='10.5' fill='#5b6660'>mapa por capas, serie anual</text><text  x='534' y='425' font-size='10.5' fill='#5b6660'>e histograma del balance</text></g><text  x='524' y='488' font-size='10.5' fill='#5b6660'>Alimenta: equipo desarrollador.</text><text  x='524' y='503' font-size='10.5' fill='#5b6660'>Consulta: personal de PROBOSQUE.</text><g><rect x='24' y='604' width='712' height='56' rx='8' fill='none' stroke='#7d8a83' stroke-width='1.25'/><text  x='36' y='626' font-size='12.5' font-weight='600' fill='#1d2320'>Infraestructura</text><text  x='36' y='645' font-size='10.5' fill='#5b6660'>Docker Compose · Nginx + Gunicorn · pruebas con pytest y Playwright · respaldos diarios · GitHub 