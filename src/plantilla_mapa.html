      <div class="grafica" id="histograma"><h3>Municipios según su cambio neto</h3>${hist}
        <p class="pie-graf" id="hist-resumen">${pierden} pierden bosque y ${ganan} ganan, de ${hs.total} municipios con ${nf.format(D.minimo)} ha o más de bosque inicial${hs.sin ? `; los otros ${hs.sin} no entran porque tienen menos` : ""}.${infoSel}</p>
        <details><summary>Ver como tabla</summary><table id="tabla-histograma"><thead><tr><th>Cambio neto</th><th>Municipios</th></tr></thead><tbody>${hs.cuentas.map((c, k) => `<tr><td>${etqBin(k)}</td><td>${c}</td></tr>`).join("")}</tbody></table></details></div>`;
  }

  // ---------- Incendios (HU-7.3 / CF-DEV-03): capa de puntos, tarjeta con tabla ----------
  // Cada incendio es un punto en su centroide (coordenadas de la malla), con tamaño por superficie
  // quemada dentro del bosque. Los datos son archivos propios (incendios/<periodo>.json) que solo se
  // piden al consultar la capa o la tabla. Un año sin capa de CONAFOR se señala; nunca se presenta como cero.
  const h1 = v => nf1.format(v);
  const nf4 = new Intl.NumberFormat("es-MX", { minimumFractionDigits: 4, maximumFractionDigits: 4 });
  let incSel = null;
  function globoIncendio(e, d, foco) {
    const otro = d.municipio_conafor && d.municipio_conafor !== d.municipio ? `<dt>Municipio (CONAFOR)</dt><dd>${esc(d.municipio_conafor)}</dd>` : "";
    globo.innerHTML = `<b>${esc(d.clave)}</b><dl><dt>Fecha de inicio</dt><dd>${esc(d.fecha)}</dd><dt>Municipio</dt><dd>${esc(d.municipio)}</dd>${otro}
      <dt>Ubicación</dt><dd>${nf4.format(d.lat)}, ${nf4.format(d.lon)}</dd><dt>Reportadas</dt><dd>${h1(d.poligono_ha)} ha</dd>
      <dt>Quemadas en bosque</dt><dd>${h1(d.en_bosque_ha)} ha</dd><dt>Sin copa al cierre</dt><dd>${h1(d.perdido_ha)} ha</dd></dl>`;
    globo.hidden = false;
    const r = lienzo.getBoundingClientRect(), gw = globo.offsetWidth, gh = globo.offsetHeight;
    const b = foco ? e.currentTarget.getBoundingClientRect() : null;
    const cx = b ? b.right : e.clientX, cy = b ? b.top : e.clientY;
    let x = cx - r.left + 14, y = cy - r.top + 14;
    if (x + gw > r.width - 8) x = cx - r.left - gw - 14;
    if (y + gh > r.height - 8) y = cy - r.top - gh - 14;
    globo.style.left = Math.max(8, x) + "px"; globo.style.top = Math.max(8, y) + "px";
  }
  function marcarIncendio(clave, scroll) {
    incSel = clave;
    capaPuntos.selectAll("circle").classed("elegido", d => d.clave === clave);
    document.querySelectorAll("#tabla-incendios tbody tr").forEach(tr => {
      const ok = tr.dataset.clave === clave;
      tr.setAttribute("aria-selected", String(ok));
      if (ok && scroll) tr.scrollIntoView({ block: "nearest" });
    });
  }
  function pintarPuntos() {
    const p = enAnio() ? null : P(), ver = !!p && st.vista === "incendios" && !!p.inc;
    const datos = ver ? p.inc.lista.filter(r => r.px != null).map(r => ({ ...r, r: Math.max(2.2, 1.7 * Math.sqrt(r.en_bosque_ha)) * W / 2400 })).sort((a, b) => b.r - a.r) : [];
    const k = d3.zoomTransform(svg.node()).k;
    capaPuntos.selectAll("circle").data(datos, d => d.clave).join("circle")
      .attr("class", d => "punto-inc" + (d.clave === incSel ? " elegido" : ""))
      .attr("cx", d => d.px).attr("cy", d => d.py).attr("r", d => d.r / Math.sqrt(k))
      .attr("tabindex", 0).attr("role", "img")
      .attr("data-clave", d => d.clave)
      .attr("aria-label", d => `Incendio ${d.clave}, ${d.fecha}, ${d.municipio}: ${h1(d.poligono_ha)} ha reportadas, ${h1(d.en_bosque_ha)} ha quemadas en bosque`)
      .on("pointerenter pointermove", (e, d) => globoIncendio(e, d))
      .on("focus", (e, d) => globoIncendio(e, d, true))
      .on("blur", ocultarGlobo)
      .on("pointerleave", e => { if (e.pointerType !== "touch") ocultarGlobo(); })
      .on("click", (e, d) => { globoIncendio(e, d); marcarIncendio(d.clave, true); });
    capaPuntos.style("display", ver ? null : "none");
    const aviso = document.getElementById("aviso-capa");
    const dice = !!p && st.vista === "incendios" && p.incendios_estado !== "completo";
    aviso.hidden = !dice;
    if (dice) aviso.textContent = `${sinCapaTxt(p)}: ${esSinDatos(p) ? "no hay incendios que mostrar" : "los puntos no incluyen lo quemado ese año"}. No significa que no los haya habido.`;
  }
  const COLS_INC = [{ c: "fecha", t: "Fecha" }, { c: "municipio", t: "Municipio" }, { c: "poligono_ha", t: "Reportadas (ha)" },
    { c: "en_bosque_ha", t: "Quemadas en bosque (ha)" }, { c: "perdido_ha", t: "Sin copa al cierre (ha)" }, { c: "clave", t: "Clave" }];
  let soloSel = true;
  function pintarTablaIncendios() {
    const cont = document.getElementById("tabla-incendios-cont"), p = P();
    if (!cont || !p.inc) return;
    const filtrar = st.sel && soloSel;
    const lista = p.inc.lista.filter(r => !filtrar || r.municipio === st.sel);
    const { col, asc } = st.ordenInc;
    lista.sort((a, b) => {
      const va = a[col], vb = b[col], r = typeof va === "string" ? va.localeCompare(vb, "es") : va - vb;
      return (asc ? r : -r) || a.clave.localeCompare(b.clave);
    });
    cont.innerHTML = `<table class="lista" id="tabla-incendios"><thead><tr>${COLS_INC.map(c => `<th scope="col" data-c="${c.c}" ${c.c === col ? `aria-sort="${asc ? "ascending" : "descending"}"` : ""}><button type="button">${c.t}</button></th>`).join("")}</tr></thead>
      <tbody>${lista.map(r => `<tr tabindex="0" data-clave="${esc(r.clave)}" aria-selected="${r.clave === incSel}"><td>${esc(r.fecha)}</td><td>${esc(r.municipio)}</td><td>${h1(r.poligono_ha)}</td><td>${h1(r.en_bosque_ha)}</td><td>${h1(r.perdido_ha)}</td><td>${esc(r.clave)}</td></tr>`).join("")}</tbody></table>
      ${lista.length ? "" : `<p class="vacio" style="padding:10px">No hay incendios${filtrar ? ` de ${esc(st.sel)}` : ""} en este periodo.</p>`}`;
    document.getElementById("inc-cuenta").textContent = `${lista.length} incendio${lista.length === 1 ? "" : "s"}${filtrar ? ` de ${st.sel}` : ""}`;
    cont.querySelectorAll("th button").forEach(b => b.addEventListener("click", () => {
      const c = b.parentElement.dataset.c;
      st.ordenInc = { col: c, asc: st.ordenInc.col === c ? !st.ordenInc.asc : ["fecha", "municipio", "clave"].includes(c) };
      pintarTablaIncendios();
    }));
    cont.querySelectorAll("tbody tr").forEach(tr => {
      const alElegir = () => {
        marcarIncendio(tr.dataset.clave, false);
        const d = p.inc.lista.find(r => r.clave === tr.dataset.clave);
        if (d && d.px != null && st.vista === "incendios") zoomA([d.px - 12, d.py - 12, d.px + 12, d.py + 12]);
      };
      tr.addEventListener("click", alElegir);
      tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); alElegir(); } });
    });
  }
  function pintarIncendios() {
    const el = document.getElementById("incendios");
    if (enAnio()) { el.hidden = true; return; }

    const p = P(), inc = p.incendios || {}, quien = st.sel || D.titulo, abierto = st.incendios && p.inc;
    const resumen = esSinDatos(p) ? `${sinCapaTxt(p)}: no hay incendios de este periodo que contar.`
      : `${nf.format(inc.n || 0)} incendios del periodo: CONAFOR reporta ${ha(inc.poligono || 0)} de polígonos; ${ha(inc.quemado || 0)} tienen dNBR ≥ 0.27, ${ha(inc.en_bosque || 0)} dentro del bosque, y ${ha(inc.perdido || 0)} de bosque quedaron sin copa al cierre.`;
    let anios = "", tabla = "";
    if (abierto) {
      const lista = p.inc.lista.filter(r => !st.sel || r.municipio === st.sel);
      const etqAnio = a => a + (p.preliminar ? p.sufijo : p.actual - p.base === 0 ? "" : a === p.base ? " (nov-dic)" : a === p.actual ? " (ene-oct)" : "");
      const filas = d3.range(p.base, p.actual + 1).map(a => {
        if (p.anios_sin_capa.includes(a)) return `<tr data-anio="${a}" data-sin-capa="1"><td>${etqAnio(a)}</td><td class="sin-capa" colspan="4">CONAFOR aún no publica los incendios de ${a}</td></tr>`;
        const r = lista.filter(x => x.fecha.slice(0, 4) === String(a));
        const suma = k => r.reduce((t, x) => t + x[k], 0);
        return `<tr data-anio="${a}"><td>${etqAnio(a)}</td><td>${r.length}</td><td>${h1(suma("poligono_ha"))}</td><td>${h1(suma("en_bosque_ha"))}</td><td>${h1(suma("perdido_ha"))}</td></tr>`;
      }).join("");
      anios = `<div class="grafica"><h3>Pérdida por incendio por año · ${esc(quien)}</h3>
        <div class="tabla-detalle"><table class="por-anio" id="tabla-incendios-anio"><thead><tr><th>Año</th><th>Incendios</th><th>Reportadas (ha)</th><th>Quemadas en bosque (ha)</th><th>Sin copa al cierre (ha)</th></tr></thead><tbody>${filas}</tbody></table></div>
        <p class="pie-graf">Por año de inicio del incendio. ${st.sel ? "Los incendios se asignan al municipio con más superficie del polígono, así que pueden diferir un poco de la columna Incendio de la tabla de municipios, que sale del balance por píxel. " : ""}La pérdida por incendio de cada municipio y periodo está en su detalle y en la tabla de municipios.</p></div>`;
      tabla = `<div class="grafica"><h3 id="inc-cuenta"></h3>
        ${st.sel ? `<label class="pie-graf"><input type="checkbox" id="inc-solo-sel" ${soloSel ? "checked" : ""}> Solo los de ${esc(st.sel)}</label>` : ""}
        <div class="desliza" id="tabla-incendios-cont"></div></div>`;
    }
    el.innerHTML = `<header><h2 id="incendios-titulo">Incendios del periodo · ${esc(p.etiqueta)}${p.preliminar ? " (preliminar)" : ""}</h2><p id="incendios-resumen">${resumen}</p></header>
      ${p.incendios_estado !== "completo" ? `<div class="aviso" id="incendios-aviso" role="note"><p><strong>${sinCapaTxt(p)}.</strong> ${esSinDatos(p) ? "Por eso este periodo no trae incendios y su pérdida por incendio no se conoce (no es cero)." : "La pérdida por incendio de este periodo es parcial: no incluye lo quemado ese año, que quedó dentro de “otras pérdidas”."}</p></div>` : ""}
      <div class="acciones"><button type="button" id="inc-abrir" aria-expanded="${!!abierto}">${abierto ? "Ocultar la tabla de incendios" : "Ver los incendios y su tabla"}</button>
        <span class="pie-graf">También en el mapa: vista «Incendios».</span></div>
      ${abierto ? `<div style="display:grid;gap:16px">${anios}${tabla}</div>` : ""}`;
    document.getElementById("inc-abrir").addEventListener("click", () => actualizar(e => { e.incendios = !e.incendios; }));
    if (abierto) {
      const chk = document.getElementById("inc-solo-sel");
      if (chk) chk.addEventListener("change", () => { soloSel = chk.checked; pintarTablaIncendios(); });
      pintarTablaIncendios();
    }
  }

  // ---------- A qué uso pasó el terreno perdido (HU-7.4 / CF-DEV-04) ----------
  // Es una estimación: un clasificador de imágenes Sentinel-2 del año final del periodo, entrenado con
  // las zonas no forestales de la Serie VII de INEGI (2021). Se presenta con su exactitud medida, el año
  // de las imágenes y la fuente. Lo que no se clasificó dice «sin dato», nunca cero. La pérdida por
  // incendio va aparte porque su causa se conoce.
  const pc = v => nf1.format(v * 100) + " %";
  function exactitudTxt(d) {
    return d.exactitud.length
      ? d.exactitud.map(x => `${x.anio}: exactitud global ${pc(x.global)} (kappa ${nf2.format(x.kappa)}, ${nf.format(x.prueba)} muestras de prueba)`).join("; ")
      : "sin medir";
  }
  function pintarDestino() {
    const el = document.getElementById("destino");
    if (enAnio()) { el.hidden = true; return; }
    el.hidden = false;
    const p = P(), d = p.destino, quien = st.sel || D.titulo;
    const f = st.sel ? fila(st.sel, p) : null;
    const hayInc = !esSinDatos(p), inc = st.sel ? (f ? f[I.inc] : null) : p.tot.inc;
    const v = d.estado === "completo" ? (st.sel ? d.filas[st.sel] : d.total) : null;
    const aparte = `<p class="aparte" id="destino-incendio">Pérdida por incendio, aparte: <strong>${!hayInc || inc == null ? "sin dato" : ha(inc) + (esParcial(p) ? "†" : "")}</strong>. Su causa se conoce (el incendio), así que no se clasifica.</p>`;
    const anios = d.anios.map(a => a.estado === "clasificado"
      ? `<tr data-anio="${a.anio}" data-estado="clasificado"><td>${esc(a.etiqueta)}</td><td>Sentinel-2 clasificado con la Serie VII (INEGI, ${d.serie_inegi})</td><td>${pc(d.exactitud.find(x => x.anio === a.anio).global)}</td></tr>`
      : `<tr data-anio="${a.anio}" data-estado="sin_dato"><td>${esc(a.etiqueta)}</td><td class="sin-dato" colspan="2">sin dato${a.motivo ? ` (${esc(a.motivo)})` : ""}</td></tr>`).join("");
    const aviso = `<div class="aviso estimacion" id="destino-estimacion" role="note">
        <p><strong>Es una estimación</strong> por clasificación de imágenes Sentinel-2${d.anio_imagenes.length ? ` de ${listaAnios(d.anio_imagenes)}` : ""}, entrenada con las zonas no forestales de la Serie VII de uso del suelo y vegetación de INEGI (${d.serie_inegi}). Exactitud medida con muestras reservadas: ${exactitudTxt(d)}. Equivocarse en cerca de la mitad de los casos es esperable: sirve para ver el orden de magnitud de las causas, no para afirmar el uso de un terreno.</p>
        <p>INEGI no ha publicado uso del suelo oficial posterior a la Serie VII (${d.serie_inegi}); por eso el destino se estima con imágenes. Un año o periodo sin clasificación dice «sin dato», no cero.${p.preliminar ? ` Preliminar: es otra temporada (${esc(p.meses)}); estas hectáreas no se comparan con las de los balances anuales.` : ""}</p></div>`;
    let cuerpo;
    if (!v) {
      cuerpo = `<p class="vacio" id="destino-sin-dato"><strong>Sin dato.</strong> ${d.estado !== "completo" ? "Este periodo no tiene clasificación del uso del suelo." : `No hay otras pérdidas clasificadas en ${esc(quien)}.`} No significa que el terreno no haya cambiado de uso.</p>`;
    } else {
      const tot = v[0], max = Math.max(...v.slice(1), 1e-9);
      const parte = x => tot > 0 ? pc(x / tot) : "—";
      cuerpo = `<ul class="barras" id="barras-destino" aria-label="Otras pérdidas de ${esc(quien)} por uso al que pasó">${DESTINOS.map((c, i) => `<li data-destino="${c.k}"><span>${c.nombre}</span>
          <span class="pista" aria-hidden="true"><span class="relleno" style="width:${(v[i + 1] / max * 100).toFixed(1)}%;background:var(${c.token})"></span></span>
          <span class="cifra">${ha(v[i + 1])} · ${parte(v[i + 1])}</span></li>`).join("")}</ul>
        <details><summary>Ver como tabla</summary><div class="tabla-detalle"><table id="tabla-destino"><thead><tr><th>Uso al que pasó</th><th>Hectáreas</th><th>% de las otras pérdidas</th></tr></thead><tbody>
          ${DESTINOS.map((c, i) => `<tr data-destino="${c.k}"><td>${c.nombre}</td><td>${n0(v[i + 1])}</td><td>${parte(v[i + 1])}</td></tr>`).join("")}
          <tr><td>Otras pérdidas</td><td>${n0(tot)}</td><td>${tot > 0 ? "100.0 %" : "—"}</td></tr></tbody></table></div></details>`;
    }
    const resumen = v ? `${quien}: de ${ha(v[0])} de otras pérdidas (${esc(p.etiqueta)}), ${DESTINOS.slice(0, 4).map((c, i) => `${v[0] > 0 ? pc(v[i + 1] / v[0]) : "—"} ${c.nombre.toLowerCase()}`).join(", ")}${v[5] > 0 ? `, ${pc(v[5] / v[0])} sin dato` : ""} (estimación).`

      ${aviso}${cuerpo}${aparte}

        <p class="pie-graf">También en el mapa: vista «Destino de la pérdida».</p></div>`;
  }

  // ---------- Leyenda ----------
  function pintarLeyenda() {
    const ul = document.getElementById("leyenda"), nota = document.getElementById("nota-mapa"), titulo = document.getElementById("leyenda-titulo");
    const cuenta = f => { const c = {}; D.unidades.forEach(u => { const k = f(u.nombre); c[k] = (c[k] || 0) + 1; }); return c; };

        `<li><span class="muestra" style="background:var(--sin-bosque)"></span>Sin bosque o fuera de la zona forestal</li>`;
      nota.textContent = `${celdas} se pinta según qué parte de ella tenía bosque en ${S.anios[st.t]}. Total: ${ha(S.tot.Todos[st.t][IS.bosque])}.`;

      }));

        <li><span class="muestra" style="background:var(--c-estable)"></span>Bosque que sigue en pie</li>
        <li><span class="muestra" style="background:var(--sin-bosque)"></span>Sin bosque o fuera de la zona forestal</li>`;

    } else if (st.vista === "neto") {

    } else {
      titulo.textContent = `Tendencia ${S.anios[0]}–${S.anios[N - 1]}`;
      choro(ETQ_TEND, cuenta(claseTend), `Pendiente por mínimos cuadrados del bosque de cada municipio, como porcentaje de su bosque de ${S.anios[0]} por año. El número a la derecha es cuántos municipios hay en cada clase.`);
    }
  }

  // ---------- Tabla ----------
  const COLS = {
    comparar: [
      { c: "nombre", t: "Municipio" }, { c: "base", t: "Bosque inicial" }, { c: "inc", t: "Incendio" },
      { c: "otras", t: "Otras pérdidas" }, { c: "gan", t: "Ganancia" }, { c: "actual", t: "Bosque final" },

      { c: "nombre", t: "Municipio" }, { c: "zona", t: "Zona forestal" }, { c: "bosque", t: "Bosque" },

  const enc = document.getElementById("encabezados");

    enc.innerHTML = COLS[st.modo].map(col => `<th scope="col" data-c="${col.c}"><button type="button">${col.t}${col.c === "bosque" ? " " + S.anios[st.t] : ""}${col.c === "inc" && !enAnio() && P().incendios_estado !== "completo" ? "†" : ""}</button></th>`).join("");

      const c = th.dataset.c;

    }));
  }
  document.getElementById("solo-bosque").addEventListener("change", e => { st.soloBosque = e.target.checked; pintarTabla(); });

  function pintarTabla() {
    let lista;
    if (enAnio()) {
      const t = st.t;
      lista = Object.keys(S.filas).map(nombre => {
        const r = serieDe(nombre)[t], tn = tendDe(nombre) || [null, null], poco = serieDe(nombre)[0][IS.bosque] < D.minimo;
        return { nombre, v: { zona: r[IS.zona], bosque: r[IS.bosque], pzona: pctZona(r), neto: t ? r[IS.neto] : null,
          pant: t ? pctAnt(r) : null, tend: tn[0], ptend: poco ? null : tn[1] }, conBosque: r[IS.bosque] > 0 || serieDe(nombre)[0][IS.bosque] > 0 };
      });
    } else {
      lista = Object.entries(P().filas).map(([nombre, f]) => ({ nombre, f, conBosque: f[I.base] > 0,
        v: { base: f[I.base], inc: f[I.inc], otras: f[I.otras], gan: f[I.gan], actual: f[I.actual], neto: f[I.neto], pct: pct(f) } }));
    }
    if (st.soloBosque) lista = lista.filter(x => x.conBosque);
    if (!COLS[st.modo].some(c => c.c === st.orden.col)) st.orden = { col: "neto", asc: true };
    const val = x => st.orden.col === "nombre" ? x.nombre : (x.v[st.orden.col] ?? Infinity);
    lista.sort((a, b) => {
      const va = val(a), vb = val(b);
      const r = typeof va === "string" ? va.localeCompare(vb, "es") : (va === vb ? 0 : va - vb);
      return st.orden.asc ? r : -r;
    });
    enc.querySelectorAll("th").forEach(th => {
      if (th.dataset.c === st.orden.col) th.setAttribute("aria-sort", st.orden.asc ? "ascending" : "descending");
      else th.removeAttribute("aria-sort");
    });
    const num = v => v == null ? "—" : n0(v);
    const celdas = enAnio()
      ? x => `<td>${num(x.v.zona)}</td><td>${num(x.v.bosque)}</td><td>${x.v.pzona == null ? "—" : nf1.format(x.v.pzona) + " %"}</td>
          <td>${x.v.neto == null ? "—" : signo(x.v.neto)}</td><td>${pctTxt(x.v.pant)}</td><td>${x.v.tend == null ? "—" : signo(x.v.tend)}</td>
          <td>${x.v.ptend == null ? "—" : `<span class="chip" style="background:var(--div-${claseTend(x.nombre).slice(1)})"></span>${pct2Txt(x.v.ptend)}`}</td>`
      : x => `<td>${n0(x.v.base)}</td><td>${incTxt(x.v.inc, P())}</td><td>${n0(x.v.otras)}</td><td>${n0(x.v.gan)}</td>
          <td>${n0(x.v.actual)}</td><td>${signo(x.v.neto)}</td>
          <td>${x.v.pct == null ? "—" : `<span class="chip" style="background:var(--div-${clase(x.f).slice(1)})"></span>${pctTxt(x.v.pct)}`}</td>`;
    const tb = document.getElementById("filas");
    tb.innerHTML = lista.map(x => `<tr tabindex="0" data-n="${esc(x.nombre)}" aria-selected="${x.nombre === st.sel}"><td>${esc(x.nombre)}</td>${celdas(x)}</tr>`).join("");
    tb.querySelectorAll("tr").forEach(tr => {
      tr.addEventListener("click", () => seleccionar(tr.dataset.n, true));
      tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); seleccionar(tr.dataset.n, true); } });
    });
    const nt = document.getElementById("nota-tabla"), txt = enAnio() ? "" : notaInc(P());
    nt.hidden = !txt; nt.textContent = txt;
    document.getElementById("tabla-titulo").textContent = enAnio() ? `Municipios · ${S.anios[st.t]}` : `Municipios · ${P().etiqueta}${P().preliminar ? " (preliminar)" : ""}`;
  }

  // ---------- Selección, búsqueda, modos, periodos ----------
  const porNombre = Object.fromEntries(D.unidades.map(u => [u.nombre, u]));
  document.getElementById("lista-unidades").innerHTML = D.unidades.map(u => `<option value="${esc(u.nombre)}"></option>`).join("");
  document.getElementById("buscar").addEventListener("change", e => {
    const q = e.target.value.trim().toLowerCase();

    if (u) seleccionar(u.nombre, true);
  });
  function seleccionar(nombre, acercar) {
    const u = porNombre[nombre];
    if (u && acercar) zoomA(u.bbox);
    const tr = [...document.querySelectorAll("#filas tr")].find(t => t.dataset.n === nombre);
    if (tr && !acercar) tr.scrollIntoView({ block: "nearest" });

  function marcarSeleccion() {

  }
  // En "Comparar años", la capa del año de pérdida muestra los años de la comparación elegida.
  // Estas funciones cambian el estado `e` que se va a aplicar (ver actualizar).
  function perdidaDelPeriodo(e) {
    if (!S) return;
    const p = D.periodos[e.p];
    S.anios.forEach((a, t) => { if (t) e.perd[t] = p.preliminar ? true : (a > p.base && a <= p.actual); });
  }
  function cambiarModo(e, modo) {
    e.modo = modo;
    e.vista = VISTAS[modo].some(([v]) => v === e.vista) ? e.vista : VISTAS[modo][0][0];
    if (modo === "anio") S.anios.forEach((a, t) => { if (t) e.perd[t] = true; }); else perdidaDelPeriodo(e);
    e.orden = { col: modo === "anio" ? "bosque" : "neto", asc: modo !== "anio" };
  }
  function cambiarPeriodo(i) {
    actualizar(e => { e.p = i; perdidaDelPeriodo(e); });
  }
  let pintado = false;
  function pintarTodo() {

    marcarSeleccion(); pintarDetalle(); pintarRaster(); pintarPuntos(); pintarPie();

  }

  // ---------- Alcances (CF-DEV-14) y pie ----------
  function pintarAlcances() {
    const anual = D.periodos.filter(p => !p.preliminar), pre = D.periodos.filter(p => p.preliminar);
    const anios = S ? S.anios : [...new Set(anual.flatMap(p => [p.base, p.actual]))].sort();
    const zona = S && S.zona_ha ? ` (${ha(S.zona_ha)})` : "";
    const umbral = S ? S.umbral : (anual[0] || D.periodos[0]).umbral;
    const exact = S ? Object.entries(S.exactitud).filter(([, v]) => v && v.global != null) : [];
    const val = D.validacion || [];
    const bloques = [
      ["Qué mide", `<p>La superficie con cobertura arbórea (hectáreas) dentro de la zona forestal: un píxel de 10 m cuenta como bosque si su NDVI es de ${nf2.format(umbral)} o más. De un año a otro separa la pérdida por incendio (dentro de un polígono de CONAFOR con dNBR ≥ 0.27), las otras pérdidas y la ganancia. No mide biomasa, carbono, densidad del arbolado ni especies (la lista de especies registradas viene del inventario de CONAFOR y es aparte).</p>`],
      ["Dónde", `<p>${esc(D.titulo)}, por municipio, dentro de la zona forestal de INEGI Serie VII${zona}: bosques, selva baja caducifolia, matorrales y vegetación secundaria arbórea${S && S.clases ? ` (claves ${esc(S.clases)})` : ""}. Fuera de esa zona no se cuenta bosque.</p>`],
      ["Cuándo", `<p>Un compuesto de noviembre-diciembre por año (${anios.join(", ")}): sin lluvias, con las parcelas secas y antes de la temporada de incendios. Los incendios de cada periodo van del 1 de noviembre al 31 de octubre.${pre.length ? ` Además, un preliminar ${pre.map(p => `${p.meses} ${p.base} → ${p.actual}`).join("; ")}, de otra temporada, que no se compara con los anteriores.` : ""}</p>`],
      ["Con qué fuentes", `<ul><li>Sentinel-2 L2A (ESA Copernicus), del catálogo libre Earth Search en AWS.</li><li>Polígonos de incendios de CONAFOR (IDEFOR), hasta ${D.conafor.ultimo}.</li>${D.inventario ? `<li>${esc(D.inventario.fuente)}, vía IDEFOR: solo para la lista de especies registradas por municipio (muestreo en una malla de ${D.inventario.malla_km} km; no entra en las cifras del bosque).</li>` : ""}<li>Uso de suelo y vegetación Serie VII de INEGI (2021) y límites municipales (IDEFOR). INEGI no ha publicado uso del suelo oficial posterior; el uso al que pasó el terreno perdido es una estimación con Sentinel-2 entrenada con esa serie.</li>${val.length ? "<li>Hansen Global Forest Change v1.13 (UMD), solo para validar.</li>" : ""}</ul>`],
    ];
    if (S) {
      const sin = S.sin_encadenar;
      const ej = sin && N > 2 ? ` Por ejemplo, ${S.anios[1]} vale ${ha(S.tot.Todos[1][IS.bosque])} en la serie; medido solo con el umbral, como lo tomaría una comparación directa que empezara en ${S.anios[1]}, daría ${ha(sin[1])}.` : "";
      bloques.push(["Cómo se arma la serie", `<p>El bosque del primer año es el que pasa el umbral. Cada año siguiente parte del anterior: un píxel solo cambia si cruza el umbral y además su NDVI cambió al menos 0.10. Así la cifra de cada año es la misma en todas las comparaciones.${ej} Antes (hasta la versión 0.6.0) cada comparación se corría por separado, así que un mismo año podía valer distinto en dos comparaciones.</p>`, "ancho"]);
    }
    document.getElementById("alcances-rejilla").innerHTML = bloques.map(([t, c, k]) => `<div class="${k || ""}"><h3>${t}</h3>${c}</div>`).join("");
    const no = [
      `Que el umbral de NDVI (${nf2.format(umbral)}) sea el correcto: es provisional (método de Otsu) y aún no se calibra con puntos de referencia de campo o fotointerpretados.`,
      `La causa de las “otras pérdidas”: pueden ser tala, plaga, sequía, cambio de uso, caída de hojas o ruido. Ninguna se ha verificado en campo.${val.length ? ` Contra Hansen GFC coinciden poco (precisión ${val.map(v => `${v.periodo.replace("_", "→")}: ${nf.format(v.precision * 100)} %`).join(", ")}, tomando Hansen como referencia).` : ""}`,
      `Que la selva baja caducifolia haya perdido cobertura: en noviembre-diciembre ya empieza a tirar las hojas, así que parte de sus “otras pérdidas” puede ser solo la temporada.`,
      `El uso al que pasó el terreno perdido (agrícola, pecuario, urbano u otro) con certeza: lo estima un clasificador entrenado con la Serie VII, que es anterior a 2023${exact.length ? `; su acuerdo con datos reservados de la misma Serie VII es de ${exact.map(([k, v]) => `${nf.format(v.global * 100)} % (kappa ${nf2.format(v.kappa)}) en ${k.slice(-4)}`).join(" y ")}` : ""}.`,
      (() => { const sin = [...new Set(D.periodos.flatMap(p => p.anios_sin_capa))].sort(); return sin.length ? `La pérdida por incendio de ${listaAnios(sin)}: CONAFOR todavía no publica sus polígonos, así que lo quemado ese año aparece como “otras pérdidas” y la página lo señala como parcial o sin dato, nunca como cero.` : null; })(),
      `La recuperación por reforestación de los programas (PS, RHF, CC): faltan sus polígonos con año de plantación y sobrevivencia. Una plantación tarda años en verse desde el satélite.`,
      S ? `Una tendencia firme: con ${N} años, la pendiente es casi el cambio total entre ${N - 1}; hacen falta más años para separarla de la variación de un año a otro.` : null,
      `Cambios menores a una fracción de hectárea, ni la degradación bajo el dosel: el píxel es de 10 m y el NDVI ve sobre todo la copa.`,
      `Una cifra oficial: es un prototipo con fuentes públicas; no sustituye al Inventario Nacional Forestal y de Suelos ni a las cifras de CONAFOR o INEGI.`,
    ].filter(Boolean);
    document.getElementById("no-afirma").innerHTML = no.map(t => `<li>${t}</li>`).join("");
  }

  function pintarPie() {
    let metodo, anios;
    if (enAnio()) {
      anios = `${S.anios[0]}–${S.anios[N - 1]}`;
      metodo = `Bosque = NDVI ≥ ${S.umbral.toFixed(2)} (umbral provisional) dentro de la zona forestal de INEGI Serie VII, con compuestos Sentinel-2 L2A de noviembre-diciembre de cada año (${S.escenas.map((e, t) => `${S.anios[t]}: ${e} escenas`).join(", ")}). Cada año parte del bosque del anterior y un píxel cambia de clase solo si su NDVI cambió al menos 0.10. Quemado = dNBR ≥ 0.27 dentro de los polígonos de incendio de CONAFOR. Las “otras pérdidas” están por verificar.`;
    } else {
      const p = P();
      anios = `${p.base}–${p.actual}`;
      const escn = p.escenas && p.escenas[0] ? ` (${p.escenas[0]} y ${p.escenas[1]} escenas)` : "";
      const inc = p.incendios && p.incendios.n ? ` Incendios del periodo: ${nf.format(p.incendios.n)}; de ${ha(p.incendios.poligono)} reportadas por CONAFOR, ${ha(p.incendios.quemado)} tienen dNBR ≥ 0.27 y ${ha(p.incendios.perdido)} quedaron sin copa.` : "";
      metodo = `Bosque = NDVI ≥ ${p.umbral.toFixed(2)} (umbral provisional) dentro de la zona forestal de INEGI Serie VII, con compuestos Sentinel-2 L2A ${p.meses} de cada año${escn}. Un píxel cambia de clase solo si su NDVI cambió al menos 0.10${p.serie ? "; las comparaciones nov-dic salen de la serie encadenada" : ""}. Quemado = dNBR ≥ 0.27 dentro de los polígonos de incendio de CONAFOR.${inc} Las “otras pérdidas” están por verificar: pueden ser tala, plaga, nieve o ruido.`;
    }
    document.getElementById("pie").innerHTML = `
      <p><strong>Método.</strong> ${metodo}</p>
      <p><strong>Fuentes.</strong> Contiene datos modificados de Copernicus Sentinel ${anios} (ESA, vía Earth Search en AWS). Fuente: INEGI, Conjunto de datos vectoriales de uso del suelo y vegetación, escala 1:250 000, serie VII. Fuente: CONAFOR, Concentrado Nacional de Polígonos de Incendios Forestales, vía IDEFOR.${D.validacion ? " Hansen/UMD/Google/USGS/NASA, Global Forest Change 2000–2025 v1.13 (CC BY 4.0)." : ""} Análisis propio; no es una postura oficial del INEGI ni de CONAFOR.</p>`;
  }

  // Volver a colorear el ráster si cambia el tema
  const alCambiarTema = () => { if (pintado) pintarRaster(); };
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", alCambiarTema);
  new MutationObserver(alCambiarTema).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  perdidaDelPeriodo(st);
  pintarAlcances();
  pintarEscala(1);
  await actualizar();
})();
</script>
