[pytest]
DJANGO_SETTINGS_MODULE = probosque.settings
testpaths = pruebas
python_files = test_*.py
addopts = -ra --browser chromium
markers =
    navegador: usa Playwright (Chromium); excluirlo con -m "not navegador" para correr solo las pruebas rápidas
    volumen: genera cientos de solicitudes (~1 min 30 s); excluirla con -m "not volumen"
    pdf_real: comprueba el PDF verdadero (WeasyPrint); las demás pruebas usan un PDF mínimo (PDF_REAL=1 las vuelve todas reales)
filterwarnings =
    ignore::DeprecationWarning
